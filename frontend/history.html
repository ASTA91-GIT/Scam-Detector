<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis History Archive - ScamGuard AI</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>

    <div class="app-shell">
        <aside class="app-sidebar" id="appSidebar"></aside>

        <div class="app-main">
            <header class="app-topbar" id="appTopbar"></header>

            <main class="app-content">
                <div class="dash-header">
                    <div>
                        <h1 style="font-size: 2rem;">Analysis History Archive</h1>
                        <p style="color: var(--text-secondary); font-size: 0.95rem;">
                            Search, filter, and audit all past job offer forensic scans.
                        </p>
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="btn btn-outline" id="compareSelectedBtn" disabled style="display: flex; align-items: center; gap: 0.4rem;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                            Compare Selected (<span id="compareCount">0</span>)
                        </button>
                        <a href="analyze.html" class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>
                            New Analysis
                        </a>
                    </div>
                </div>

                <!-- Filters & Search Toolbar -->
                <div class="cyber-card" style="margin-bottom: 1.5rem; padding: 1.25rem;">
                    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 1rem; align-items: center;">
                        <!-- Search Box -->
                        <div style="position: relative;">
                            <input type="text" id="historySearchInput" class="form-control" placeholder="Search by company, job title, or keyword..." style="padding-left: 2.5rem;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        </div>

                        <!-- Risk Filter -->
                        <div>
                            <select id="historyRiskFilter" class="form-control">
                                <option value="All">All Risk Levels</option>
                                <option value="Safe">Safe Only</option>
                                <option value="Suspicious">Suspicious Only</option>
                                <option value="High Risk">High Risk Only</option>
                            </select>
                        </div>

                        <!-- Sort Order -->
                        <div>
                            <select id="historySortSelect" class="form-control">
                                <option value="newest">Newest Scans First</option>
                                <option value="oldest">Oldest Scans First</option>
                                <option value="score_high">Highest Trust Score</option>
                                <option value="score_low">Lowest Trust Score</option>
                            </select>
                        </div>

                        <!-- Reset / Refresh -->
                        <button class="btn btn-outline" id="resetHistoryFiltersBtn" title="Reset Filters">
                            Reset
                        </button>
                    </div>
                </div>

                <!-- Results List Container -->
                <div id="historyListContainer" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                    <div class="skeleton skeleton-card" style="height: 90px;"></div>
                    <div class="skeleton skeleton-card" style="height: 90px;"></div>
                    <div class="skeleton skeleton-card" style="height: 90px;"></div>
                </div>

                <!-- Pagination Toolbar -->
                <div id="historyPagination" style="display: none; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
                    <span style="font-size: 0.88rem; color: var(--text-muted);" id="paginationSummary">Showing 0 of 0 scans</span>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <button class="btn btn-outline btn-sm" id="prevPageBtn" disabled>Previous</button>
                        <span id="pageIndicator" style="font-size: 0.88rem; font-weight: 600; padding: 0 0.5rem;">Page 1 of 1</span>
                        <button class="btn btn-outline btn-sm" id="nextPageBtn" disabled>Next</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Analysis Comparison Modal (Section 31) -->
    <div class="cyber-modal-overlay" id="compareModal">
        <div class="cyber-modal" style="max-width: 860px; width: 90%; background: var(--bg-surface); border: 1px solid var(--accent-cyan); border-radius: var(--radius-lg);">
            <div class="cyber-modal-header" style="border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; padding: 1.25rem;">
                <h3 class="cyber-modal-title" style="font-family: var(--font-syne); color: #fff;">Forensic Analysis Comparison</h3>
                <button class="cyber-modal-close" id="closeCompareModal" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            <div class="cyber-modal-body" id="compareModalBody" style="padding: 1.5rem; max-height: 75vh; overflow-y: auto;">
                <div style="text-align: center; padding: 2rem; color: var(--text-muted);">Loading comparison metrics...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="core.js"></script>
    <script src="case_ai.js"></script>
    <script src="history.js"></script>
</body>
</html>
