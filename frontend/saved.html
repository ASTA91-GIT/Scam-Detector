<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Reports Repository - ScamGuard AI</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>

    <div class="app-shell">
        <aside class="app-sidebar" id="appSidebar"></aside>

        <div class="app-main">
            <header class="app-topbar" id="appTopbar"></header>

            <main class="app-content">
                <div class="dash-header">
                    <div>
                        <h1 style="font-size: 2rem;">Saved Reports Repository</h1>
                        <p style="color: var(--text-secondary); font-size: 0.95rem;">
                            Your curated library of bookmarked scam dossiers, investigator notes, and verified offers.
                        </p>
                    </div>
                </div>

                <!-- Search Bar -->
                <div class="cyber-card" style="margin-bottom: 1.5rem; padding: 1rem 1.25rem;">
                    <div style="position: relative;">
                        <input type="text" id="savedSearchInput" class="form-control" placeholder="Search saved reports by title, company, or personal notes..." style="padding-left: 2.5rem;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    </div>
                </div>

                <!-- Saved List Container -->
                <div id="savedReportsContainer" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                    <div class="skeleton skeleton-card" style="height: 110px;"></div>
                    <div class="skeleton skeleton-card" style="height: 110px;"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Edit Notes / Rename Modal -->
    <div class="cyber-modal-overlay" id="editSavedReportModal">
        <div class="cyber-modal">
            <div class="cyber-modal-header">
                <h3 class="cyber-modal-title">Edit Saved Report Dossier</h3>
                <button class="cyber-modal-close" id="closeEditSavedModal">&times;</button>
            </div>
            <div class="cyber-modal-body">
                <div class="form-group">
                    <label class="form-label" for="editSavedTitle">Report Title</label>
                    <input type="text" id="editSavedTitle" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label" for="editSavedNotes">Investigator Notes & Follow-up Details</label>
                    <textarea id="editSavedNotes" class="form-control" rows="4" placeholder="Enter interview timeline, recruiter email, fraud report numbers, or notes..."></textarea>
                </div>
            </div>
            <div class="cyber-modal-footer">
                <button class="btn btn-outline" id="cancelEditSavedModal">Cancel</button>
                <button class="btn btn-primary" id="saveEditSavedModalBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="core.js"></script>
    <script src="case_ai.js"></script>
    <script src="saved.js"></script>
</body>
</html>
