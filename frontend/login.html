<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ScamGuard AI</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem;">

    <div style="max-width: 440px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="index.html" class="sidebar-brand" style="justify-content: center; margin-bottom: 1rem;">
                <div class="brand-shield" style="width: 44px; height: 44px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <span class="brand-name" style="font-size: 1.4rem;">ScamGuard<span class="brand-ai">AI</span></span>
            </a>
            <h2>Welcome Back</h2>
            <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px;">Sign in to your cybersecurity workspace</p>
        </div>

        <div class="cyber-card cyber-card-glow" style="padding: 2.25rem;">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="analyst@domain.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
                        <label class="form-label" for="loginPassword" style="margin-bottom:0;">Password</label>
                    </div>
                    <div style="position: relative;">
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="toggleLoginPassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div id="loginErrorMsg" class="badge-danger" style="display:none; padding:0.65rem 1rem; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:1.25rem; width:100%; text-transform:none; font-weight:500;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn" style="padding: 0.85rem;">
                    <span id="loginBtnText">Sign In to Dashboard</span>
                    <span id="loginSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <!-- 2FA Challenge Box (Section 12) -->
            <div id="twoFaChallengeBox" style="display: none;">
                <div style="text-align: center; margin-bottom: 1.25rem;">
                    <div style="display: inline-flex; padding: 0.75rem; border-radius: 50%; background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); margin-bottom: 0.5rem;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <h3 style="font-size: 1.15rem;">Two-Factor Verification</h3>
                    <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 2px;">Enter the 6-digit code from your authenticator app</p>
                </div>

                <form id="twoFaChallengeForm">
                    <input type="hidden" id="twoFaTempToken">
                    
                    <div class="form-group" id="totpCodeGroup">
                        <input type="text" id="twoFaCodeInput" class="form-control" placeholder="000000" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" style="text-align: center; font-family: monospace; font-size: 1.4rem; letter-spacing: 6px; padding: 0.75rem;">
                    </div>

                    <div class="form-group" id="recoveryCodeGroup" style="display: none;">
                        <label class="form-label" for="twoFaRecoveryInput">Backup Recovery Code</label>
                        <input type="text" id="twoFaRecoveryInput" class="form-control" placeholder="e.g. A1B2C3D4" style="text-align: center; font-family: monospace; font-size: 1rem; text-transform: uppercase;">
                    </div>

                    <div id="twoFaErrorMsg" class="badge-danger" style="display:none; padding:0.65rem 1rem; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:1.25rem; width:100%; text-transform:none; font-weight:500;"></div>

                    <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; margin-bottom: 0.75rem;">
                        Verify & Authenticate
                    </button>

                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; margin-top: 0.5rem;">
                        <button type="button" id="toggleRecoveryModeBtn" class="btn btn-link" style="color: var(--accent-cyan); padding: 0; font-size: 0.8rem; background: none; border: none; cursor: pointer;">Use Backup Recovery Code</button>
                        <a href="login.html" style="color: var(--text-muted);">Back to sign in</a>
                    </div>
                </form>
            </div>

            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.88rem; color: var(--text-secondary);">
                Don't have an analyst account? <a href="signup.html" style="font-weight: 600;">Create Account</a>
            </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Return to home page
            </a>
        </div>
    </div>

    <script src="core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already authenticated, redirect
            if (getToken()) {
                window.location.href = 'dashboard.html';
                return;
            }

            const toggleBtn = document.getElementById('toggleLoginPassword');
            const passInput = document.getElementById('loginPassword');
            toggleBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.style.color = isPass ? 'var(--accent-cyan)' : 'var(--text-muted)';
            });

            const form = document.getElementById('loginForm');
            const submitBtn = document.getElementById('loginSubmitBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');
            const errorBox = document.getElementById('loginErrorMsg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.style.display = 'none';

                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                if (!email || !password) {
                    errorBox.textContent = 'Please fill in both email and password';
                    errorBox.style.display = 'block';
                    return;
                }

                btnText.style.display = 'none';
                spinner.style.display = 'inline-block';
                submitBtn.disabled = true;

                try {
                    const res = await fetch(`${API_BASE_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        const errMsg = (typeof getErrorMessage === 'function')
                            ? getErrorMessage(data, 'Authentication failed. Please check credentials.')
                            : (data?.error?.message || data?.error || 'Authentication failed. Please check credentials.');
                        throw new Error(errMsg);
                    }

                    if (data.require_2fa) {
                        // Switch form to 2FA challenge
                        form.style.display = 'none';
                        const twoFaBox = document.getElementById('twoFaChallengeBox');
                        twoFaBox.style.display = 'block';
                        document.getElementById('twoFaTempToken').value = data.temp_token;
                        document.getElementById('twoFaCodeInput').focus();
                        return;
                    }

                    setToken(data.token);
                    setUser(data.user);
                    showToast('Authentication verified. Welcome back!', 'success');

                    // Check if redirect query param exists
                    const params = new URLSearchParams(window.location.search);
                    const target = params.get('redirect') || 'dashboard.html';
                    setTimeout(() => { window.location.href = target; }, 400);

                } catch (err) {
                    errorBox.textContent = err.message;
                    errorBox.style.display = 'block';
                } finally {
                    btnText.style.display = 'inline';
                    spinner.style.display = 'none';
                    submitBtn.disabled = false;
                }
            });

            // 2FA Challenge Submission
            const twoFaForm = document.getElementById('twoFaChallengeForm');
            const twoFaError = document.getElementById('twoFaErrorMsg');
            twoFaForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                twoFaError.style.display = 'none';

                const temp_token = document.getElementById('twoFaTempToken').value;
                const code = document.getElementById('twoFaCodeInput').value.trim();
                const recovery_code = document.getElementById('twoFaRecoveryInput').value.trim();

                try {
                    const res = await fetch(`${API_BASE_URL}/auth/login/2fa`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ temp_token, code, recovery_code })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.error?.message || data.error || 'Invalid 2FA code.');
                    }

                    setToken(data.token);
                    setUser(data.user);
                    showToast('2FA verification successful. Welcome back!', 'success');
                    const params = new URLSearchParams(window.location.search);
                    const target = params.get('redirect') || 'dashboard.html';
                    setTimeout(() => { window.location.href = target; }, 400);
                } catch (err) {
                    twoFaError.textContent = err.message;
                    twoFaError.style.display = 'block';
                }
            });

            document.getElementById('toggleRecoveryModeBtn')?.addEventListener('click', () => {
                const recGroup = document.getElementById('recoveryCodeGroup');
                const totpGroup = document.getElementById('totpCodeGroup');
                const isRec = recGroup.style.display === 'block';
                recGroup.style.display = isRec ? 'none' : 'block';
                totpGroup.style.display = isRec ? 'block' : 'none';
                document.getElementById('toggleRecoveryModeBtn').textContent = isRec ? 'Use Backup Recovery Code' : 'Use Authenticator Code';
            });
        });
    </script>
</body>
</html>
