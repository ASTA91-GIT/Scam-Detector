<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Analyst Account - ScamGuard AI</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem 1.5rem;">

    <div style="max-width: 480px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="index.html" class="sidebar-brand" style="justify-content: center; margin-bottom: 1rem;">
                <div class="brand-shield" style="width: 44px; height: 44px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <span class="brand-name" style="font-size: 1.4rem;">ScamGuard<span class="brand-ai">AI</span></span>
            </a>
            <h2>Initialize Analyst Access</h2>
            <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px;">Zero-trust job offer scanning workspace</p>
        </div>

        <div class="cyber-card cyber-card-glow" style="padding: 2.25rem;">
            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="signupUsername">Analyst Username / Name</label>
                    <input type="text" id="signupUsername" class="form-control" placeholder="Alex Rivers" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" class="form-control" placeholder="alex@domain.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupPassword">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="signupPassword" class="form-control" placeholder="Minimum 8 characters" required autocomplete="new-password">
                        <button type="button" id="toggleSignupPassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>

                    <!-- Password Strength Meter -->
                    <div class="password-meter">
                        <div class="password-meter-fill" id="passStrengthBar"></div>
                    </div>

                    <ul class="rules-checklist" id="passRulesList">
                        <li id="rule-length"><span>○</span> 8+ characters</li>
                        <li id="rule-upper"><span>○</span> Uppercase letter</li>
                        <li id="rule-lower"><span>○</span> Lowercase letter</li>
                        <li id="rule-number"><span>○</span> Number</li>
                        <li id="rule-special"><span>○</span> Special character</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" class="form-control" placeholder="Repeat password" required autocomplete="new-password">
                </div>

                <div class="form-group" style="display: flex; align-items: flex-start; gap: 0.65rem; margin-top: 1rem;">
                    <input type="checkbox" id="termsAccepted" required style="margin-top: 4px; accent-color: var(--accent-cyan); width: 16px; height: 16px;">
                    <label for="termsAccepted" style="font-size: 0.82rem; color: var(--text-secondary); line-height: 1.4; cursor: pointer;">
                        I acknowledge that ScamGuard AI provides threat probability heuristics and agrees to the <a href="intelligence.html" target="_blank">Safety Protocols</a>.
                    </label>
                </div>

                <div id="signupErrorMsg" class="badge-danger" style="display:none; padding:0.65rem 1rem; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:1.25rem; width:100%; text-transform:none; font-weight:500;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="signupSubmitBtn" style="padding: 0.85rem;">
                    <span id="signupBtnText">Create Free Account</span>
                    <span id="signupSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.88rem; color: var(--text-secondary);">
                Already have an account? <a href="login.html" style="font-weight: 600;">Sign In</a>
            </div>
        </div>
    </div>

    <script src="core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (getToken()) {
                window.location.href = 'dashboard.html';
                return;
            }

            const toggleBtn = document.getElementById('toggleSignupPassword');
            const passInput = document.getElementById('signupPassword');
            toggleBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.style.color = isPass ? 'var(--accent-cyan)' : 'var(--text-muted)';
            });

            // Password strength calculation
            const meterBar = document.getElementById('passStrengthBar');
            const rules = {
                length: document.getElementById('rule-length'),
                upper: document.getElementById('rule-upper'),
                lower: document.getElementById('rule-lower'),
                number: document.getElementById('rule-number'),
                special: document.getElementById('rule-special')
            };

            function checkRules(val) {
                const results = {
                    length: val.length >= 8,
                    upper: /[A-Z]/.test(val),
                    lower: /[a-z]/.test(val),
                    number: /\d/.test(val),
                    special: /[@$!%*?&#^()_+\-=\[\]{};:\'",.<>\/]/.test(val)
                };

                let passedCount = 0;
                for (const [key, passed] of Object.entries(results)) {
                    if (passed) {
                        passedCount++;
                        rules[key].classList.add('valid');
                        rules[key].querySelector('span').textContent = '●';
                    } else {
                        rules[key].classList.remove('valid');
                        rules[key].querySelector('span').textContent = '○';
                    }
                }

                // Meter update
                const percent = (passedCount / 5) * 100;
                meterBar.style.width = `${percent}%`;
                if (percent <= 20) meterBar.style.backgroundColor = '#ef4444';
                else if (percent <= 60) meterBar.style.backgroundColor = '#f59e0b';
                else if (percent <= 80) meterBar.style.backgroundColor = '#38bdf8';
                else meterBar.style.backgroundColor = '#10b981';

                return passedCount === 5;
            }

            passInput.addEventListener('input', () => checkRules(passInput.value));

            const form = document.getElementById('signupForm');
            const submitBtn = document.getElementById('signupSubmitBtn');
            const btnText = document.getElementById('signupBtnText');
            const spinner = document.getElementById('signupSpinner');
            const errorBox = document.getElementById('signupErrorMsg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.style.display = 'none';

                const username = document.getElementById('signupUsername').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const password = passInput.value;
                const confirmPassword = document.getElementById('signupConfirmPassword').value;

                if (!username || !email || !password) {
                    errorBox.textContent = 'All fields are required';
                    errorBox.style.display = 'block';
                    return;
                }

                if (password !== confirmPassword) {
                    errorBox.textContent = 'Passwords do not match';
                    errorBox.style.display = 'block';
                    return;
                }

                if (!checkRules(password)) {
                    errorBox.textContent = 'Please fulfill all password security criteria';
                    errorBox.style.display = 'block';
                    return;
                }

                btnText.style.display = 'none';
                spinner.style.display = 'inline-block';
                submitBtn.disabled = true;

                try {
                    const res = await fetch(`${API_BASE_URL}/auth/signup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        throw new Error(data.error || 'Registration failed.');
                    }

                    setToken(data.token);
                    setUser(data.user);
                    showToast('Account initialized successfully. Welcome to ScamGuard AI!', 'success');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);

                } catch (err) {
                    errorBox.textContent = err.message;
                    errorBox.style.display = 'block';
                } finally {
                    btnText.style.display = 'inline';
                    spinner.style.display = 'none';
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
