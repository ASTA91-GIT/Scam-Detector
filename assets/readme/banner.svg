<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="cyber-grid" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="radar-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanning Line Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.08"/>
    </pattern>

    <style>
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(380px); opacity: 0; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.9)); }
      }

      @keyframes beacon {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.6); opacity: 0.3; }
      }

      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes dataStream {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .title-bracket {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-weight: 800;
        font-size: 50px;
        animation: pulseGlow 3s infinite ease-in-out;
      }

      .brand-title {
        font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 48px;
        letter-spacing: 2px;
      }

      .brand-sub {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 4px;
        fill: #94a3b8;
      }

      .badge-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.8px;
      }

      .laser-line {
        animation: scanline 4.5s infinite linear;
      }

      .beacon-dot {
        transform-origin: center;
        animation: beacon 2s infinite ease-out;
      }

      .radar-arm {
        transform-origin: 1070px 180px;
        animation: radarSweep 6s infinite linear;
      }

      .stream-path {
        stroke-dasharray: 20 10;
        animation: dataStream 25s infinite linear;
      }

      .hero-badge-group {
        animation: floatSlow 4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>

  <!-- Cyber Grid -->
  <rect width="1200" height="380" rx="16" fill="url(#grid-pattern)"/>

  <!-- Top & Bottom Accent Gradient Borders -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#card-border)"/>
  <rect x="0" y="378" width="1200" height="2" fill="url(#card-border)"/>

  <!-- Corner Tech Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 1180 50 L 1180 20 L 1150 20" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 20 330 L 20 360 L 50 360" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 1180 330 L 1180 360 L 1150 360" stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Animated Laser Scanline -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accent-cyan)" stroke-width="1.5" opacity="0.6" class="laser-line"/>

  <!-- Ambient Circuit Traces (Left & Background) -->
  <g opacity="0.25">
    <path d="M 0 100 L 180 100 L 240 160 L 400 160" stroke="#38bdf8" stroke-width="1.2" fill="none" class="stream-path"/>
    <path d="M 0 280 L 140 280 L 210 210 L 350 210" stroke="#f59e0b" stroke-width="1.2" fill="none" class="stream-path"/>
    <circle cx="240" cy="160" r="3" fill="#38bdf8"/>
    <circle cx="210" cy="210" r="3" fill="#f59e0b"/>
    <circle cx="400" cy="160" r="3" fill="#38bdf8"/>
    <circle cx="350" cy="210" r="3" fill="#f59e0b"/>
  </g>

  <!-- Right Side Interactive Radar Display -->
  <g opacity="0.85">
    <!-- Outer Rings -->
    <circle cx="1070" cy="180" r="110" stroke="#1e293b" stroke-width="1.5" fill="#070c18" fill-opacity="0.6"/>
    <circle cx="1070" cy="180" r="85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" fill="none"/>
    <circle cx="1070" cy="180" r="60" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" fill="none" stroke-dasharray="4 4"/>
    <circle cx="1070" cy="180" r="35" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    <circle cx="1070" cy="180" r="10" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" fill-opacity="0.2"/>

    <!-- Crosshairs -->
    <line x1="960" y1="180" x2="1180" y2="180" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="1070" y1="70" x2="1070" y2="290" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Rotating Radar Beam -->
    <g class="radar-arm">
      <path d="M 1070 180 L 1180 180 A 110 110 0 0 0 1148 102 Z" fill="url(#radar-beam)"/>
      <line x1="1070" y1="180" x2="1180" y2="180" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Radar Target Blips -->
    <g>
      <!-- Blip 1: Threat Detected -->
      <circle cx="1115" cy="140" r="4" fill="#f43f5e" filter="url(#glow-amber)"/>
      <circle cx="1115" cy="140" r="8" stroke="#f43f5e" stroke-width="1" fill="none" class="beacon-dot"/>
      <text x="1125" y="143" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f43f5e" font-weight="700">ALERT: 94%</text>

      <!-- Blip 2: Verified Safe -->
      <circle cx="1025" cy="220" r="3.5" fill="#10b981"/>
      <circle cx="1025" cy="220" r="7" stroke="#10b981" stroke-width="0.8" fill="none" opacity="0.5"/>
      <text x="980" y="235" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">SAFE: 08%</text>

      <!-- Blip 3: Domain Flag -->
      <circle cx="1040" cy="130" r="3" fill="#fbbf24"/>
    </g>
    <text x="1070" y="315" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="1.5">FORENSIC RADAR // ACTIVE</text>
  </g>

  <!-- Left/Center Main Branding Container -->
  <g transform="translate(80, 0)">

    <!-- Top Status Indicator Pill -->
    <g transform="translate(0, 68)">
      <rect width="270" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <!-- Green Pulsing Dot -->
      <circle cx="18" cy="14" r="4.5" fill="#10b981" class="beacon-dot"/>
      <circle cx="18" cy="14" r="4.5" fill="#10b981"/>
      <text x="32" y="18" class="badge-text" fill="#cbd5e1">AI CORE v2.4 <tspan fill="#64748b">|</tspan> <tspan fill="#10b981" font-weight="700">100% OFFLINE</tspan></text>
      <!-- Mini Shield -->
      <path d="M 235 9 L 244 12 L 244 17 C 244 20 239.5 22 239.5 22 C 239.5 22 235 20 235 17 Z" fill="none" stroke="#38bdf8" stroke-width="1.3"/>
    </g>

    <!-- Main Title Block: [ SCAM-DETECTTOR ] -->
    <g transform="translate(0, 150)">
      <!-- Left Bracket -->
      <text x="0" y="0" class="title-bracket" fill="#38bdf8" filter="url(#glow-cyan)">[</text>

      <!-- SCAM- -->
      <text x="32" y="0" class="brand-title" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
        SCAM-
      </text>

      <!-- DETECTTOR -->
      <text x="210" y="0" class="brand-title" fill="url(#accent-amber)" filter="url(#glow-amber)">
        DETECTTOR
      </text>

      <!-- Right Bracket -->
      <text x="560" y="0" class="title-bracket" fill="#fbbf24" filter="url(#glow-amber)">]</text>

      <!-- AI Sparkle Tag -->
      <rect x="585" y="-38" width="62" height="22" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
      <text x="616" y="-23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">AI 3.2</text>
    </g>

    <!-- Tagline Subtitle -->
    <text x="4" y="195" class="brand-sub">
      ENTERPRISE FORENSIC FRAUD &amp; EMPLOYMENT SCAM INTELLIGENCE ENGINE
    </text>

    <!-- Secondary Capabilities Description -->
    <text x="4" y="226" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">
      Deep magic-byte inspection • Local Ollama LLM • SSRF quarantine • Cryptographic webhooks
    </text>

    <!-- Live Feature Pills Bar -->
    <g transform="translate(0, 260)" class="hero-badge-group">
      <!-- Badge 1: Ollama 3.2 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#0d1527" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="14" y="21" class="badge-text" fill="#38bdf8">🧠 Local Ollama 3.2:3b</text>
      </g>

      <!-- Badge 2: Zero Cloud Fallback -->
      <g transform="translate(195, 0)">
        <rect width="185" height="34" rx="8" fill="#0d1527" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="14" y="21" class="badge-text" fill="#34d399">🛡️ Zero Cloud Fallback</text>
      </g>

      <!-- Badge 3: SSRF Protected -->
      <g transform="translate(395, 0)">
        <rect width="180" height="34" rx="8" fill="#0d1527" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="14" y="21" class="badge-text" fill="#fbbf24">🔒 SSRF Guard &amp; 2FA</text>
      </g>

      <!-- Badge 4: Signed Webhooks -->
      <g transform="translate(590, 0)">
        <rect width="190" height="34" rx="8" fill="#0d1527" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="14" y="21" class="badge-text" fill="#a5b4fc">⚡ HMAC-SHA256 Webhooks</text>
      </g>
    </g>

    <!-- Version & Build Telemetry Line -->
    <g transform="translate(4, 325)">
      <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">
        SYSTEM_ID: <tspan fill="#38bdf8">SGD-2026.PROD</tspan> | STACK: <tspan fill="#cbd5e1">PYTHON 3.10 + FLASK + NODE 18 + MONGO 6.0</tspan> | PROTOCOL: <tspan fill="#10b981">STRICT SECURE</tspan>
      </text>
    </g>

  </g>
</svg>
